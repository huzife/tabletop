<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690"
 viewBox="0 0 1180 690" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 z" fill="#5A6675"/>
  </marker>
</defs>
<rect x="0" y="0" width="1180" height="690" fill="#FFFFFF"/>
<text x="590.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A37">SQLite 持久化实体关系</text>
<rect x="60" y="85" width="300" height="173" rx="6" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.6"/><rect x="60" y="85" width="300" height="38" rx="6" fill="#DCEAF9" stroke="#2E75B6" stroke-width="1.6"/><text x="74" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A37">accounts</text><text x="74" y="145" text-anchor="start" font-size="11" fill="#1F2A37">PK id</text><text x="74" y="170" text-anchor="start" font-size="11" fill="#5B6B7B">UQ username_normalized</text><text x="74" y="195" text-anchor="start" font-size="11" fill="#5B6B7B">password_hash</text><text x="74" y="220" text-anchor="start" font-size="11" fill="#5B6B7B">role / status</text><text x="74" y="245" text-anchor="start" font-size="11" fill="#5B6B7B">created_at / updated_at</text><rect x="60" y="360" width="300" height="173" rx="6" fill="#FFFFFF" stroke="#538135" stroke-width="1.6"/><rect x="60" y="360" width="300" height="38" rx="6" fill="#E2EFDA" stroke="#538135" stroke-width="1.6"/><text x="74" y="385" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A37">sessions</text><text x="74" y="420" text-anchor="start" font-size="11" fill="#1F2A37">PK id</text><text x="74" y="445" text-anchor="start" font-size="11" fill="#5B6B7B">FK account_id</text><text x="74" y="470" text-anchor="start" font-size="11" fill="#5B6B7B">UQ token_hash</text><text x="74" y="495" text-anchor="start" font-size="11" fill="#5B6B7B">csrf_secret_hash</text><text x="74" y="520" text-anchor="start" font-size="11" fill="#5B6B7B">expires_at / revoked_at</text><rect x="440" y="85" width="300" height="173" rx="6" fill="#FFFFFF" stroke="#C55A11" stroke-width="1.6"/><rect x="440" y="85" width="300" height="38" rx="6" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.6"/><text x="454" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A37">site_settings</text><text x="454" y="145" text-anchor="start" font-size="11" fill="#1F2A37">PK singleton_id = 1</text><text x="454" y="170" text-anchor="start" font-size="11" fill="#5B6B7B">enabled</text><text x="454" y="195" text-anchor="start" font-size="11" fill="#5B6B7B">maintenance_message</text><text x="454" y="220" text-anchor="start" font-size="11" fill="#5B6B7B">FK updated_by</text><text x="454" y="245" text-anchor="start" font-size="11" fill="#5B6B7B">updated_at</text><rect x="820" y="85" width="300" height="148" rx="6" fill="#FFFFFF" stroke="#B88700" stroke-width="1.6"/><rect x="820" y="85" width="300" height="38" rx="6" fill="#FFF0B3" stroke="#B88700" stroke-width="1.6"/><text x="834" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A37">game_service_settings</text><text x="834" y="145" text-anchor="start" font-size="11" fill="#1F2A37">PK game_id</text><text x="834" y="170" text-anchor="start" font-size="11" fill="#5B6B7B">enabled</text><text x="834" y="195" text-anchor="start" font-size="11" fill="#5B6B7B">FK updated_by</text><text x="834" y="220" text-anchor="start" font-size="11" fill="#5B6B7B">updated_at</text><rect x="440" y="385" width="680" height="148" rx="6" fill="#FFFFFF" stroke="#73559A" stroke-width="1.6"/><rect x="440" y="385" width="680" height="38" rx="6" fill="#E9E3F4" stroke="#73559A" stroke-width="1.6"/><text x="454" y="410" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A37">audit_logs</text><text x="454" y="445" text-anchor="start" font-size="11" fill="#1F2A37">PK id / created_at</text><text x="454" y="470" text-anchor="start" font-size="11" fill="#5B6B7B">FK actor_account_id (nullable) + actor_username snapshot</text><text x="454" y="495" text-anchor="start" font-size="11" fill="#5B6B7B">action / target_type / target_id / target_label</text><text x="454" y="520" text-anchor="start" font-size="11" fill="#5B6B7B">result / source_ip / request_id / metadata_json</text><line x1="210" y1="262" x2="210" y2="360" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><text x="225" y="320" text-anchor="start" font-size="11" fill="#5B6B7B">1 对多，账号删除级联会话</text><polyline points="360,170 400,170 400,150 440,150" fill="none" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,190 780,190 780,150 820,150" fill="none" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="360,220 395,220 395,455 440,455" fill="none" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><text x="590" y="650" text-anchor="middle" font-size="14" font-weight="700" fill="#B54A4A">房间、对局、聊天、邀请令牌和房间密码不进入 SQLite</text>
</svg>