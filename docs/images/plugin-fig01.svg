<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650"
 viewBox="0 0 1120 650" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 z" fill="#5A6675"/>
  </marker>
</defs>
<rect x="0" y="0" width="1120" height="650" fill="#FFFFFF"/>
<text x="560.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A37">游戏插件组成与依赖边界</text>
<rect x="40" y="55" width="1040" height="540" rx="8" fill="#FBFCFD" stroke="#7A8795" stroke-width="1.6"/><text x="65" y="82" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A37">单个 games/&lt;game-id&gt; 包</text><rect x="335" y="105" width="450" height="95" rx="8" fill="#FFF0B3" stroke="#B88700" stroke-width="1.6"/><text x="560.0" y="137.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A37">shared</text><text x="560.0" y="157.5" text-anchor="middle" font-size="13" fill="#5B6B7B">manifest / settings / actions / safe view</text><text x="560.0" y="177.5" text-anchor="middle" font-size="13" fill="#5B6B7B">浏览器与服务端均可依赖</text><rect x="90" y="270" width="400" height="130" rx="8" fill="#E2EFDA" stroke="#538135" stroke-width="1.6"/><text x="290.0" y="310.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A37">server</text><text x="290.0" y="330.0" text-anchor="middle" font-size="13" fill="#5B6B7B">权威状态 / 规则 / 截止任务</text><text x="290.0" y="350.0" text-anchor="middle" font-size="13" fill="#5B6B7B">projectView / 可选 AI</text><text x="290.0" y="370.0" text-anchor="middle" font-size="13" fill="#5B6B7B">不得依赖 React 或 WebSocket</text><rect x="630" y="270" width="400" height="130" rx="8" fill="#DCEAF9" stroke="#2E75B6" stroke-width="1.6"/><text x="830.0" y="310.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A37">web</text><text x="830.0" y="330.0" text-anchor="middle" font-size="13" fill="#5B6B7B">设置编辑器 / 游戏界面</text><text x="830.0" y="350.0" text-anchor="middle" font-size="13" fill="#5B6B7B">输入预检 / 展示事件动画</text><text x="830.0" y="370.0" text-anchor="middle" font-size="13" fill="#5B6B7B">不得导入权威状态或 AI</text><rect x="90" y="475" width="400" height="85" rx="8" fill="#E9E3F4" stroke="#73559A" stroke-width="1.6"/><text x="290.0" y="512.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A37">平台服务端</text><text x="290.0" y="532.5" text-anchor="middle" font-size="13" fill="#5B6B7B">Room Queue / Game Host / Scheduler</text><rect x="630" y="475" width="400" height="85" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.6"/><text x="830.0" y="512.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A37">浏览器公共外壳</text><text x="830.0" y="532.5" text-anchor="middle" font-size="13" fill="#5B6B7B">路由 / 房间 Store / 动作发送器</text><line x1="290" y1="270" x2="430" y2="200" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="830" y1="270" x2="690" y2="200" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="290" y1="475" x2="290" y2="400" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="830" y1="475" x2="830" y2="400" stroke="#5A6675" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="490,520 560,520 560,335 630,335" fill="none" stroke="#5A6675" stroke-width="1.8" stroke-dasharray="6 5"/><text x="560" y="505" text-anchor="middle" font-size="12" fill="#5B6B7B">只经协议 DTO 通信</text><text x="560" y="620" text-anchor="middle" font-size="13" fill="#5B6B7B">禁止游戏间依赖；平台调用插件，插件不反向访问全局房间或数据库</text>
</svg>